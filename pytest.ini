# Configurazione di pytest (P6, T-36 → T-38).
#
# DJANGO_SETTINGS_MODULE ripete il valore di manage.py: pytest non passa da
# manage.py, quindi il setdefault che sta li' non ha alcun effetto qui.
#
# NIENTE --reuse-db negli addopts. Sarebbe piu' veloce, ma la fase 2 aggiunge
# una migrazione: un database riusato non la applicherebbe, e i test
# fallirebbero con una colonna mancante e nessun indizio sul perche'. Chi
# ripete la suite molte volte lo aggiunge da riga di comando, sapendo che
# dopo ogni nuova migrazione serve --create-db.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = rag/tests
